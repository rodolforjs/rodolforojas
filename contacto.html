  <div class="col-12 container-fluid p-3 mt-5">
    <div class="row m-0">

      <!-- TÍTULO -->
      <div class="col-12 mb-5">
        <div class="cta-row d-flex flex-wrap align-items-center gap-3 gap-lg-4">
            <h2 class="cta-titulo cta-t1">
              LANZA LA IDEA
            </h2>
          </div>
          <div class="cta-row d-flex flex-wrap align-items-center gap-3 gap-lg-4">
            <h2 class="cta-titulo flex-grow-1 cta-t2">
              <video class="cta-img-inline" autoplay muted loop playsinline><source src="images/alice in wonderland time GIF.mp4" type="video/mp4"></video>
              Y AVANZAMOS
            </h2>
          </div>
      </div>
      <!-- FORMULARIO -->
      <div class="col-12">
        <div class="form-row-item">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" class="form-field-input" placeholder="Eduardo Vargas" autocomplete="off" />
        </div>
        <div class="form-row-item">
          <label for="correo">Correo</label>
          <input type="email" id="correo" class="form-field-input" placeholder="Bonvallet@yahoo.cl" autocomplete="off" />
        </div>
        <div class="form-row-item">
          <label for="numero">Número</label>
          <input type="tel" id="numero" class="form-field-input" placeholder="9 XXXX XXXX" autocomplete="off" />
        </div>
        <div class="intereses-row">
          <span class="intereses-label">Intereses</span>
          <div class="intereses-tags">
            <span class="interes-tag" onclick="toggleInteres(this)">UX/UI</span>
            <span class="interes-tag" onclick="toggleInteres(this)">Graphic Design</span>
            <span class="interes-tag" onclick="toggleInteres(this)">Interaction Design</span>
            <span class="interes-tag" onclick="toggleInteres(this)">Visual Design</span>
            <span class="interes-tag" onclick="toggleInteres(this)">Motion</span>
            <span class="interes-tag" onclick="toggleInteres(this)">3D</span>
          </div>
        </div>
        <div class="brief-row">
          <span class="brief-label">Brief</span>
          <textarea id="brief" class="brief-textarea" placeholder="Cuento corto sobre tu proyecto, fechas, etc"></textarea>
        </div>
        <div class="text-center" style="padding: 48px 0;">
          <button class="btn-enviar" onclick="enviarFormulario()">
            Enviar
            <span class="btn-enviar-arrow">→</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts.js"></script>
